<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tims 1x1</title>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #1a0a3a;
  color: #f0f0ff;
  min-height: 100vh;
}
h1 {
  text-align: center;
  font-size: 2.5em;
  color: #f7c948;
  margin-bottom: 6px;
}
.subtitle {
  text-align: center;
  color: #9d9abf;
  margin-bottom: 24px;
}
.scorebar {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.chip {
  background: #2a1a50;
  border: 2px solid #444;
  border-radius: 30px;
  padding: 7px 18px;
  font-weight: bold;
  font-size: 1em;
}
.stars {
  text-align: center;
  font-size: 1.6em;
  margin-bottom: 20px;
  min-height: 40px;
  letter-spacing: 2px;
}
.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}
.tab {
  background: #2a1a50;
  border: 2px solid #444;
  color: #9d9abf;
  padding: 8px 22px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 1em;
  font-weight: bold;
}
.tab.active {
  background: #7c3aed;
  border-color: #7c3aed;
  color: white;
}
#quizSection {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#tableSection {
  display: none;
  max-width: 700px;
  margin: 0 auto;
}
.qcard {
  background: #2a1a50;
  border: 2px solid #444;
  border-radius: 20px;
  padding: 40px 50px;
  text-align: center;
  width: 100%;
  max-width: 560px;
  box-sizing: border-box;
}
.qlabel {
  font-size: 0.85em;
  color: #9d9abf;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.qtext {
  font-size: 3.5em;
  font-weight: bold;
  color: #f0f0ff;
  margin-bottom: 16px;
}
.qtext .op { color: #f7c948; }
.qtext .qm { color: #4ecdc4; }
.progress {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;
}
.pdot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #444;
  display: inline-block;
}
.pdot.ok   { background: #4ecdc4; }
.pdot.bad  { background: #ff6b6b; }
.pdot.cur  { background: #f7c948; }
.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  width: 100%;
  max-width: 560px;
}
.abtn {
  background: #2a1a50;
  border: 2px solid #444;
  color: #f0f0ff;
  font-size: 2.2em;
  font-weight: bold;
  padding: 26px 10px;
  border-radius: 16px;
  cursor: pointer;
}
.abtn:hover { border-color: #7c3aed; transform: translateY(-2px); }
.abtn.correct { background: #0d4040; border-color: #4ecdc4; color: #4ecdc4; }
.abtn.wrong   { background: #400d0d; border-color: #ff6b6b; color: #ff6b6b; }
.abtn.reveal  { background: #0d2a2a; border-color: #4ecdc4; color: #4ecdc4; }
.feedback {
  font-size: 1.1em;
  font-weight: bold;
  text-align: center;
  min-height: 28px;
}
.feedback.ok  { color: #4ecdc4; }
.feedback.bad { color: #ff6b6b; }
.nextbtn {
  display: none;
  background: linear-gradient(135deg, #7c3aed, #4ecdc4);
  border: none;
  color: white;
  font-size: 1.3em;
  font-weight: bold;
  padding: 14px 44px;
  border-radius: 30px;
  cursor: pointer;
}
.nextbtn.show { display: inline-block; }
/* RESULT */
#resultScreen {
  display: none;
  text-align: center;
}
#resultScreen h2 { font-size: 2.5em; color: #f7c948; }
#resultScreen .big { font-size: 5em; margin: 10px 0; }
#resultScreen .msg { color: #9d9abf; font-size: 1.1em; margin-bottom: 20px; }
.restartbtn {
  background: linear-gradient(135deg, #f7c948, #ff6b6b);
  border: none;
  color: #1a0a3a;
  font-size: 1.3em;
  font-weight: bold;
  padding: 14px 44px;
  border-radius: 30px;
  cursor: pointer;
}
/* PRAISE */
#praiseBox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  align-items: center;
  justify-content: center;
  z-index: 999;
}
#praiseBox.show { display: flex; }
.praise-inner {
  background: #2a1a50;
  border: 3px solid #4ecdc4;
  border-radius: 24px;
  padding: 30px 48px;
  text-align: center;
  animation: popIn 0.4s ease;
}
.praise-inner.streak { border-color: #f7c948; }
.praise-emoji { font-size: 3.5em; margin-bottom: 8px; }
.praise-text  { font-size: 2em; font-weight: bold; color: #f0f0ff; }
.praise-sub   { font-size: 1em; color: #9d9abf; margin-top: 6px; }
.praise-sub.s { color: #f7c948; font-size: 1.1em; }
@keyframes popIn {
  0%   { transform: scale(0.3); opacity: 0; }
  70%  { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); }
}
/* TABLE */
.tgrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.tcard {
  background: #2a1a50;
  border: 2px solid #444;
  border-radius: 14px;
  overflow: hidden;
}
.thead {
  padding: 9px 14px;
  font-weight: bold;
  color: #f7c948;
  background: rgba(247,201,72,0.1);
  font-size: 1em;
}
.trows { padding: 8px 14px 12px; }
.trow {
  display: flex;
  justify-content: space-between;
  font-size: 0.9em;
  padding: 3px 0;
  border-bottom: 1px solid #333;
  color: #9d9abf;
}
.trow:last-child { border: none; }
.tres { color: #f0f0ff; font-weight: bold; }
/* CONFETTI */
.conf {
  position: fixed;
  width: 9px; height: 9px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 1000;
  animation: fall 1.4s ease-in forwards;
}
@keyframes fall {
  0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
/* MATHE SURFER */
#surferBox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
#surferBox.show { display: flex; }
.surfer-inner {
  background: linear-gradient(160deg, #0a2a4a, #0d1f3a);
  border: 3px solid #f7c948;
  border-radius: 28px;
  padding: 36px 52px;
  text-align: center;
  max-width: 380px;
  animation: popIn 0.5s ease;
  position: relative;
  overflow: hidden;
}
.surfer-waves {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(180deg, transparent, #0a4a6a);
  animation: wave 2s ease-in-out infinite alternate;
}
@keyframes wave {
  from { transform: translateY(10px) scaleX(1); }
  to   { transform: translateY(0px) scaleX(1.05); }
}
.surfer-scene {
  font-size: 5em;
  margin-bottom: 8px;
  animation: surf 1.5s ease-in-out infinite alternate;
  display: block;
  position: relative;
  z-index: 1;
}
@keyframes surf {
  from { transform: translateY(0px) rotate(-5deg); }
  to   { transform: translateY(-14px) rotate(5deg); }
}
.surfer-title {
  font-size: 2.2em;
  font-weight: bold;
  color: #f7c948;
  text-shadow: 0 0 20px rgba(247,201,72,0.6);
  margin-bottom: 6px;
  position: relative; z-index: 1;
}
.surfer-sub {
  font-size: 1em;
  color: #a0d0ff;
  margin-bottom: 20px;
  position: relative; z-index: 1;
}
.surfer-close {
  background: linear-gradient(135deg, #f7c948, #ff6b6b);
  border: none;
  color: #1a0a3a;
  font-size: 1.1em;
  font-weight: bold;
  padding: 12px 34px;
  border-radius: 30px;
  cursor: pointer;
  position: relative; z-index: 1;
}
</style>
</head>
<body>

<h1>&#10024; Tims 1&#215;1</h1>
<p class="subtitle">von Lehrer Klaus &middot; Lerne die Einmaleins-Aufgaben!</p>

<div class="scorebar">
  <div class="chip">&#10003; Richtig: <span id="sC">0</span></div>
  <div class="chip">&#10007; Falsch: <span id="sW">0</span></div>
  <div class="chip">&#128293; Serie: <span id="sS">0</span></div>
</div>

<div class="stars" id="starRow"></div>

<div class="tabs">
  <button class="tab active" id="tabQuiz" onclick="switchTab('quiz')">&#127918; 20 Aufgaben</button>
  <button class="tab"        id="tabTable" onclick="switchTab('table')">&#128203; Tabelle</button>
</div>

<div id="quizSection">
  <div class="qcard" id="qcard">
    <div class="qlabel">Aufgabe <span id="qNum">1</span> von 20</div>
    <div class="qtext" id="qText">...</div>
    <div class="progress" id="prog"></div>
  </div>
  <div class="answers" id="aGrid"></div>
  <div class="feedback" id="fb"></div>
  <button class="nextbtn" id="nBtn" onclick="nextQ()">Weiter &#8594;</button>
  <div id="resultScreen">
    <h2>Fertig! &#127881;</h2>
    <div class="big" id="resEmoji"></div>
    <div class="msg" id="resMsg"></div>
    <button class="restartbtn" onclick="restart()">&#128260; Nochmal!</button>
  </div>
</div>

<div id="tableSection">
  <div class="tgrid" id="tGrid"></div>
</div>

<div id="praiseBox">
  <div class="praise-inner" id="praiseInner">
    <div class="praise-emoji" id="pEmoji"></div>
    <div class="praise-text"  id="pText"></div>
    <div class="praise-sub"   id="pSub"></div>
  </div>
</div>

<script>
var qs=[], cur=0, corr=0, wrng=0, strk=0, done=false, hist=[], praiseTimer=null;

var praise=[
  {e:'&#10003;', t:'Richtig!',          s:'Weiter so!'},
  {e:'&#11088;', t:'Super gemacht!',     s:'Zwei in Folge!'},
  {e:'&#127775;',t:'Toll! Drei richtig!',s:'Auf zur Serie!'},
  {e:'&#128640;',t:'Fantastisch!',       s:'4 in Folge!'},
  {e:'&#127885;',t:'Du bist ein Profi!', s:'5 richtig hintereinander!'},
  {e:'&#129504;',t:'MATHE-GENIE!',       s:'Unaufhaltbar!!'}
];

function gen() {
  var pool=[];
  for(var a=4;a<=9;a++) for(var b=4;b<=9;b++) pool.push([a,b]);
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  return pool.slice(0,20);
}

function opts(ans) {
  var o=[ans];
  while(o.length<4){var v=ans+Math.floor(Math.random()*15)-7;if(v>0&&o.indexOf(v)===-1)o.push(v);}
  return o.sort(function(){return Math.random()-0.5;});
}

function stars() {
  var r=document.getElementById('starRow'), h='';
  for(var i=0;i<10;i++) h+=(i<strk?'&#11088;':'<span style="opacity:0.15">&#11088;</span>');
  r.innerHTML=h;
}

function score() {
  document.getElementById('sC').innerHTML=corr;
  document.getElementById('sW').innerHTML=wrng;
  document.getElementById('sS').innerHTML=strk;
  stars();
}

function prog() {
  var r=document.getElementById('prog'), h='';
  for(var i=0;i<20;i++){
    var c='pdot';
    if(i<cur) c+=(hist[i]?' ok':' bad');
    else if(i===cur) c+=' cur';
    h+='<span class="'+c+'"></span>';
  }
  r.innerHTML=h;
}

function showQ() {
  done=false;
  document.getElementById('nBtn').className='nextbtn';
  document.getElementById('fb').innerHTML='';
  document.getElementById('fb').className='feedback';
  var p=qs[cur], a=p[0], b=p[1];
  document.getElementById('qNum').innerHTML=cur+1;
  document.getElementById('qText').innerHTML=
    a+' <span class="op">&#215;</span> '+b+' <span class="op">=</span> <span class="qm">?</span>';
  prog();
  var ans=a*b, os=opts(ans);
  var g=document.getElementById('aGrid');
  g.innerHTML='';
  for(var i=0;i<os.length;i++){
    var btn=document.createElement('button');
    btn.className='abtn';
    btn.innerHTML=os[i];
    btn.setAttribute('data-val',os[i]);
    btn.setAttribute('data-ans',ans);
    btn.onclick=pick;
    g.appendChild(btn);
  }
}

function pick() {
  if(done) return;
  done=true;
  var chosen=parseInt(this.getAttribute('data-val'));
  var ans=parseInt(this.getAttribute('data-ans'));
  var ok=(chosen===ans);
  if(ok){
    corr++; strk++;
    hist[cur]=true;
    this.className='abtn correct';
    var fb=strk>=5?'Unglaublich! &#128293;':strk>=3?'Serie laeuft! &#128293;':'Richtig! &#10024;';
    document.getElementById('fb').innerHTML=fb;
    document.getElementById('fb').className='feedback ok';
    showPraise(strk);
    confetti(Math.min(10+strk*10,80));
  } else {
    wrng++; strk=0;
    hist[cur]=false;
    this.className='abtn wrong';
    document.getElementById('fb').innerHTML='Falsch! Die Antwort war '+ans+' &#128532;';
    document.getElementById('fb').className='feedback bad';
    var btns=document.getElementById('aGrid').getElementsByTagName('button');
    for(var i=0;i<btns.length;i++){
      if(parseInt(btns[i].getAttribute('data-val'))===ans) btns[i].className='abtn reveal';
    }
  }
  var btns2=document.getElementById('aGrid').getElementsByTagName('button');
  for(var i=0;i<btns2.length;i++) btns2[i].disabled=true;
  score();
  if(cur+1>=20){
    var delay=ok?2000:1200;
    setTimeout(result, delay);
  } else {
    var d=ok?600:0;
    setTimeout(function(){document.getElementById('nBtn').className='nextbtn show';},d);
  }
}

function showPraise(s) {
  var idx=Math.min(s-1,praise.length-1);
  var p=praise[idx];
  var isS=s>=3;
  document.getElementById('pEmoji').innerHTML=p.e;
  document.getElementById('pText').innerHTML=p.t;
  document.getElementById('pSub').innerHTML=p.s;
  document.getElementById('pSub').className='praise-sub'+(isS?' s':'');
  document.getElementById('praiseInner').className='praise-inner'+(isS?' streak':'');
  document.getElementById('praiseBox').className='show';
  if(praiseTimer) clearTimeout(praiseTimer);
  praiseTimer=setTimeout(function(){document.getElementById('praiseBox').className='';},1900);
}

function nextQ() {
  cur++;
  showQ();
}

function result() {
  document.getElementById('aGrid').style.display='none';
  document.getElementById('nBtn').className='nextbtn';
  document.getElementById('qcard').style.display='none';
  document.getElementById('fb').style.display='none';
  var pct=Math.round(corr/20*100);
  var e=pct===100?'&#127942;':pct>=80?'&#127775;':pct>=60?'&#128522;':'&#128170;';
  var m=pct===100?'Perfekt! Du bist ein Mathe-Genie!':
        pct>=80?'Sehr gut! Weiter ueben!':
        pct>=60?'Gut gemacht! Weiter so!':'Nicht aufgeben!';
  document.getElementById('resEmoji').innerHTML=e;
  document.getElementById('resMsg').innerHTML=corr+' von 20 richtig ('+pct+'%) &middot; '+m;
  document.getElementById('resultScreen').style.display='block';
  confetti(pct>=80?60:20);
}

function restart() {
  cur=0; corr=0; wrng=0; strk=0; done=false; hist=[];
  qs=gen();
  document.getElementById('aGrid').style.display='grid';
  document.getElementById('qcard').style.display='block';
  document.getElementById('fb').style.display='block';
  document.getElementById('resultScreen').style.display='none';
  score(); showQ();
}

function switchTab(t) {
  document.getElementById('tabQuiz').className='tab'+(t==='quiz'?' active':'');
  document.getElementById('tabTable').className='tab'+(t==='table'?' active':'');
  document.getElementById('quizSection').style.display=t==='quiz'?'flex':'none';
  document.getElementById('tableSection').style.display=t==='table'?'block':'none';
}

function confetti(n) {
  var cols=['#f7c948','#ff6b6b','#4ecdc4','#a78bfa','#ffffff'];
  for(var i=0;i<n;i++){
    (function(i2){
      setTimeout(function(){
        var c=document.createElement('div');
        c.className='conf';
        c.style.left=Math.random()*100+'%';
        c.style.top='0';
        c.style.background=cols[Math.floor(Math.random()*cols.length)];
        c.style.animationDuration=(1+Math.random())+'s';
        c.style.animationDelay=Math.random()*0.5+'s';
        document.body.appendChild(c);
        setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},2500);
      },i2*30);
    })(i);
  }
}

// Build table
function buildTable() {
  var g=document.getElementById('tGrid'), h='';
  for(var t=1;t<=10;t++){
    var rows='';
    for(var i=1;i<=10;i++) rows+='<div class="trow"><span>'+t+' x '+i+'</span><span class="tres">'+t*i+'</span></div>';
    h+='<div class="tcard"><div class="thead">Das '+t+'er-Einmaleins</div><div class="trows">'+rows+'</div></div>';
  }
  g.innerHTML=h;
}

// START
buildTable();
qs=gen();
showQ();
score();
</script>
</body>
</html>
